name: Compile Sovereign Node

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable
        run: pyinstaller --onefile --name sovereign-node-${{ matrix.os }} cmd/sovereign-node/main.py

      - name: Upload Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Node-${{ matrix.os }}
          path: dist/
